name: Docs

# Builds the documentation site with MkDocs and publishes it to GitHub Pages.
# The live site is https://azadkshitij.github.io/qtpy-nodeeditor/
#
# The site is deployed when a commit is pushed to main and its message
# contains "publish" (case-insensitive), for example:
#
#     git commit -m "docs: rebuild the site, publish"
#     git push
#
# Any other push leaves the live site alone, so the site is only rebuilt when
# you ask for it. The workflow can also be run by hand from the Actions tab.
#
# First time only: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    # Only build for a "publish" commit, or when the workflow is started by hand.
    # contains() is case-insensitive, so "publish", "Publish" and "published" all match.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit.message != null &&
       contains(github.event.head_commit.message, 'publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_docs.txt
          pip install -e ".[pyqt6]"

      - name: Build
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit.message != null &&
       contains(github.event.head_commit.message, 'publish'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
