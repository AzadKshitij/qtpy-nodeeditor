[pytest]
# pytest-qt configuration
qt_api = pyqt6

# Minimum version of pytest
minversion = 8.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    qt: marks tests that use Qt functionality (deselect with '-m "not qt"')
    signal: marks tests that test signal emission
    slow: marks tests as slow
    integration: marks tests as integration tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
